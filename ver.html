<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documento · Webinar Raevo</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1f1e;--mute:#6b706d;--line:#e4e2dc;--acc:#1f7a5c;--code:#f0efea}
@media (prefers-color-scheme:dark){:root{--bg:#141615;--card:#1d201f;--ink:#ecedeb;--mute:#9aa09c;--line:#2e3230;--acc:#4cc196;--code:#262a28}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 24px 24px;overflow-wrap:anywhere}
a{color:var(--acc)} pre{background:var(--code);padding:12px;border-radius:8px;white-space:pre-wrap;font-size:14px}
code{background:var(--code);padding:1px 4px;border-radius:4px;font-size:.92em} pre code{background:none;padding:0}
table{border-collapse:collapse;display:block;overflow-x:auto} td,th{border:1px solid var(--line);padding:4px 8px;font-size:14px}
.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:14px}
</style>
</head>
<body><main>
<div class="top"><a href="./">← Voltar ao painel</a><a id="raw" href="#">Ficheiro original</a></div>
<article id="doc">A carregar…</article>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const f=new URLSearchParams(location.search).get('f')||'';
const doc=document.getElementById('doc');
if(!/^docs\/[\w.-]+\.md$/.test(f)){doc.textContent='Documento inválido.'}
else{document.getElementById('raw').href=f;
  fetch(f+'?'+Date.now()).then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>{
    doc.innerHTML=marked.parse(t.replace(/<[^>]*>/g,''));
    const h=doc.querySelector('h1');if(h)document.title=h.textContent+' · Webinar Raevo';
  }).catch(()=>doc.textContent='Não foi possível abrir o documento.');}
</script>
</body></html>
